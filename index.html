<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos - Mulher da Sopa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2, h3 {
            color: #ff8c00;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e07b00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mulher da Sopa - Checkout</h2>
        
        <div class="form-group">
            <h3>Seu Pedido</h3>
            <p id="resumo-pedido">1x Sopa Tradicional da Casa - R$ 15,00</p>
            <p><strong>Total: R$ 15,00</strong></p>
        </div>

        <form id="order-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço de Entrega:</label>
                <input type="text" id="endereco" required placeholder="Rua, número, bairro">
            </div>

            <div class="form-group">
                <label for="pagamento">Forma de Pagamento:</label>
                <select id="pagamento" required>
                    <option value="">Selecione...</option>
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button type="submit">Finalizar Pedido</button>
        </form>
    </div>

    <script>
        // URL gerada pelo Localtunnel
        const BACKEND_URL = 'https://wild-candies-wear.loca.lt';

        document.getElementById('order-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const pedidoData = {
                nome: document.getElementById('nome').value,
                endereco: document.getElementById('endereco').value,
                pagamento: document.getElementById('pagamento').value,
                itens: '1x Sopa Tradicional da Casa',
                total: '15,00'
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pedidoData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('Pedido realizado com sucesso!');
                    document.getElementById('order-form').reset();
                } else {
                    alert('Erro ao enviar pedido.');
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Erro ao conectar com o servidor backend. Verifique se o server.js está rodando e se a URL está correta!');
            }
        });
    </script>

</body>
</html>
